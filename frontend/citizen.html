<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Citizen Dashboard — Civix</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'
        %3E%3Crect width='100' height='100' rx='22' fill='%232563EB' /%3E%3Ctext x='50' y='66'
        font-family='Inter,sans-serif' font-size='56' font-weight='800' fill='white' text-anchor='middle'
        %3EC%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div id="root"></div>

    <div class="app-shell">
        <!-- Top bar -->
        <header class="topbar">
            <div class="container topbar-inner">
                <a class="brand" href="index.html" data-testid="brand-logo">
                    <span class="brand-mark blue">C</span>
                    Civix
                </a>
                <div class="topbar-right">
                    <span class="role-pill" data-testid="role-pill"><span class="dot"></span> Citizen</span>
                    <a class="btn btn-ghost" href="login.html" data-testid="logout-button">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" stroke-linecap="round"
                                stroke-linejoin="round" />
                            <path d="M10 17l-5-5 5-5M5 12h12" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                        Logout
                    </a>
                </div>
            </div>
        </header>

        <main class="app-main">
            <div class="container">
                <!-- Page heading -->
                <div class="page-head">
                    <div>
                        <span class="eyebrow">Citizen Portal</span>
                        <h2 style="margin-top: 14px;">Welcome Back.</h2>
                        <p>Submit a new report or check the status of your recent submissions.</p>
                    </div>
                </div>

                <div class="two-col">
                    <!-- Quick action / submit complaint -->
                    <section class="card card-pad quick-action" data-testid="quick-action-card">
                        <h3>Submit a complaint</h3>
                        <p class="sub">Help us keep the city running. Reports are routed to the right team within
                            minutes.</p>

                        <form id="complaint-form" autocomplete="off">
                            <div class="row-2">
                                <div class="field">
                                    <label for="c-category">Category</label>
                                    <select id="c-category" class="input" data-testid="complaint-category-select">
                                        <option>Pothole</option>
                                        <option>Street lighting</option>
                                        <option>Garbage collection</option>
                                        <option>Water leakage</option>
                                        <option>Stray animals</option>
                                        <option>Other</option>
                                    </select>
                                </div>
                                <div class="field">
                                    <label for="c-location">Location</label>
                                    <input id="c-location" type="text" class="input" placeholder="e.g. MG Road,
                                        Sector 14" data-testid="complaint-location-input" />
                                </div>
                            </div>

                            <div class="field">
                                <label for="c-desc">Describe the issue</label>
                                <textarea id="c-desc" class="input" placeholder="Tell us what you saw, when, and
                                    any details that can help the crew."
                                    data-testid="complaint-description-input"></textarea>
                            </div>

                            <div style="display:flex; gap: 10px; flex-wrap: wrap; margin-top: 4px;">
                                <button type="submit" class="btn btn-blue" data-testid="complaint-submit-button">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2.2">
                                        <path d="M5 12l5 5L20 7" stroke-linecap="round" stroke-linejoin="round" />
                                    </svg>
                                    Submit report
                                </button>
                                <button type="button" class="btn btn-ghost" id="attach-btn"
                                    data-testid="complaint-attach-button">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2.2">
                                        <path d="M21 12.5l-8.5 8.5a5 5 0 0 1-7-7l9.5-9.5a3.5 3.5 0 0 1 5 5L11 18a2 2 0
                                            0 1-3-3l8-8" stroke-linecap="round" stroke-linejoin="round" />
                                    </svg>
                                    <span id="attach-label">Attach photo</span>
                                </button>
                                <input type="file" id="photo-upload" style="display: none;" accept="image/*" />
                            </div>
                        </form>
                    </section>

                    <!-- Recent activity timeline -->
                    <section class="card" data-testid="recent-activity-card">
                        <div class="list-head">
                            <h3>Recent activity</h3>
                            <a class="link" href="#" data-testid="view-all-activity">View all</a>
                        </div>
                        <div style="padding: 22px;">
                            <div class="timeline" id="activity-timeline">
                                <div class="ti-body">Loading...</div>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </main>
    </div>

    <script>
        let base64Image = "";

        document.getElementById('attach-btn').addEventListener('click', () => {
            document.getElementById('photo-upload').click();
        });

        document.getElementById('photo-upload').addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('attach-label').innerText = file.name;
                const reader = new FileReader();
                reader.onload = function (evt) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800;
                        const MAX_HEIGHT = 800;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width *= MAX_HEIGHT / height;
                                height = MAX_HEIGHT;
                            }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        base64Image = canvas.toDataURL('image/jpeg', 0.7);
                    }
                    img.src = evt.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('complaint-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const original = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = 'Getting location & Submitting…';

            const token = localStorage.getItem('authToken');
            if (!token) {
                alert('You must be logged in.');
                btn.disabled = false;
                btn.innerHTML = original;
                return;
            }

            const getPos = () => new Promise((resolve, reject) => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(resolve, reject);
                } else {
                    reject(new Error("Geolocation not supported"));
                }
            });

            let locationString = document.getElementById('c-location').value;
            try {
                const pos = await getPos();
                locationString += ` (Lat: ${pos.coords.latitude.toFixed(5)}, Lng: ${pos.coords.longitude.toFixed(5)})`;
            } catch (err) {
                console.warn("Could not get geolocation", err);
            }

            const data = {
                category: document.getElementById('c-category').value,
                location: locationString,
                description: document.getElementById('c-desc').value,
                image_url: base64Image
            };

            try {
                const res = await fetch('http://localhost:8000/citizen_submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(data)
                });

                if (res.ok) {
                    btn.innerHTML = '✓ Submitted';
                    setTimeout(() => {
                        btn.disabled = false;
                        btn.innerHTML = original;
                        e.target.reset();
                        document.getElementById('attach-label').innerText = "Attach photo";
                        base64Image = "";
                        loadActivity(); // reload timeline
                    }, 1500);
                } else {
                    const errData = await res.json();
                    alert('Error: ' + (errData.error || 'Failed to submit'));
                    btn.disabled = false;
                    btn.innerHTML = original;
                }
            } catch (err) {
                alert('Connection error');
                btn.disabled = false;
                btn.innerHTML = original;
            }
        });

        async function loadActivity() {
            const token = localStorage.getItem('authToken');
            if (!token) return;
            const res = await fetch('http://localhost:8000/api/citizen/complaints', {
                headers: { 'Authorization': `Bearer ${token}` },
                cache: 'no-store'
            });
            const data = await res.json();
            const timeline = document.getElementById('activity-timeline');
            timeline.innerHTML = '';

            if (data.error) {
                timeline.innerHTML = `<div class="ti-body" style="color: red;">Error: ${data.error}</div>`;
                return;
            }

            if (data.length === 0) {
                timeline.innerHTML = '<div class="ti-body">No recent activity.</div>';
                return;
            }

            data.forEach(item => {
                const isDone = (item.status === 'verified' || item.status === 'completed');
                const isAmber = (item.status === 'pending');
                let cssClass = isDone ? ' done' : (isAmber ? ' amber' : '');
                let badgeClass = item.status === 'pending' ? 'pending' : (item.status === 'in-progress' ? 'in-progress' : 'verified');

                let dateStr = item.created_at ? new Date(item.created_at).toLocaleString() : 'Just now';

                timeline.innerHTML += `
                    <div class="timeline-item${cssClass}">
                        <div class="ti-head">
                            <span class="ti-title">${item.category} — ${item.status.toUpperCase()}</span>
                            <span class="badge ${badgeClass}">${item.status}</span>
                        </div>
                        <div class="ti-meta">${item.id.substring(0, 8)} · ${dateStr}</div>
                        <div class="ti-body">${item.description}</div>
                        ${item.image_url ? `<img src="${item.image_url}" style="max-width: 200px; margin-top: 10px; border-radius: 8px;">` : ''}
                    </div>
                `;
            });
        }

        // Initial load
        loadActivity();
    </script>
</body>

</html>
