<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="stylesheet" href="../../css/forms.css">
    <title>Account Settings | Smart Waste</title>
    <style>
        .profile-card { background: white; padding: 40px; border-radius: 16px; box-shadow: var(--shadow); max-width: 800px; }
        .profile-header { display: flex; align-items: center; gap: 30px; margin-bottom: 30px; border-bottom: 1px solid #f1f5f9; padding-bottom: 30px; }
        
        .avatar-container { position: relative; width: 120px; height: 120px; }
        .avatar-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 4px solid var(--primary); }
        .edit-overlay { 
            position: absolute; bottom: 5px; right: 5px; background: var(--secondary); 
            color: white; border-radius: 50%; width: 32px; height: 32px; 
            display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px;
        }
        
        .editable-field { border: 1px solid transparent; padding: 8px; border-radius: 6px; width: 100%; transition: 0.3s; }
        .editing .editable-field { border-color: #cbd5e1; background: #f8fafc; }
    </style>
</head>
<body>
    <nav class="side-nav">
        <h3 style="padding: 0 1rem; color: var(--primary);">SMART WASTE</h3>
        <button class="nav-item" onclick="location.href='dashboard.html'">Dashboard</button>
        <button class="nav-item" onclick="location.href='new-complaint.html'">New Complaint</button>
        <button class="nav-item active">Profile</button>
        <button class="nav-item logout-btn" onclick="logout()">Logout</button>
    </nav>

    <main class="main-content">
        <div class="profile-card" id="profile-container">
            <div class="profile-header">
                <div class="avatar-container">
                    <img id="display-avatar" src="https://ui-avatars.com/api/?name=User&background=2ecc71&color=fff&size=128" class="avatar-img">
                    <label for="image-upload" class="edit-overlay">📷</label>
                    <input type="file" id="image-upload" hidden accept="image/*" onchange="previewImage(event)">
                </div>
                <div>
                    <h2 id="display-name" style="margin:0">Loading...</h2>
                    <p id="display-email" style="color: #64748b;"></p>
                </div>
            </div>

            <div class="info-grid">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="edit-name" class="editable-field" readonly>
                </div>
                <div class="input-group">
                    <label>Phone Number</label>
                    <input type="text" id="edit-phone" class="editable-field" value="+91 98765 43210" readonly>
                </div>
                <div class="input-group">
                    <label>Preferred Zone</label>
                    <select id="edit-zone" class="editable-field" disabled>
                        <option>Sector 4 - Urban</option>
                        <option>Sector 7 - Industrial</option>
                        <option>North Block</option>
                    </select>
                </div>
            </div>

            <div style="margin-top: 30px; display: flex; gap: 10px;">
                <button id="edit-btn" onclick="toggleEdit()" class="btn-primary" style="width: auto; padding: 10px 30px;">Edit Profile</button>
                <button id="save-btn" onclick="saveProfile()" class="btn-primary" style="width: auto; padding: 10px 30px; display:none; background:#34495e">Save Changes</button>
            </div>
        </div>
    </main>

    <script src="../../js/citizen.js"></script>
    <script>
        // Initialize page data
        window.onload = () => {
            const savedName = localStorage.getItem('userName') || "Test User";
            const savedEmail = localStorage.getItem('userEmail') || "test@gmail.com";
            const savedImg = localStorage.getItem('userAvatar');

            document.getElementById('display-name').innerText = savedName;
            document.getElementById('edit-name').value = savedName;
            document.getElementById('display-email').innerText = savedEmail;
            
            if(savedImg) document.getElementById('display-avatar').src = savedImg;
        };

        function toggleEdit() {
            const container = document.getElementById('profile-container');
            const inputs = document.querySelectorAll('.editable-field');
            const isEditing = container.classList.toggle('editing');

            inputs.forEach(input => {
                input.readOnly = !isEditing;
                input.disabled = !isEditing;
            });

            document.getElementById('edit-btn').style.display = isEditing ? 'none' : 'block';
            document.getElementById('save-btn').style.display = isEditing ? 'block' : 'none';
        }

        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function() {
                const output = document.getElementById('display-avatar');
                output.src = reader.result;
                // Save to local storage immediately or on 'Save'
                localStorage.setItem('userAvatar', reader.result);
            }
            reader.readAsDataURL(event.target.files[0]);
        }

        async function saveProfile() {
            const newName = document.getElementById('edit-name').value;
            
            // Save to local storage (The Mock Backend way)
            localStorage.setItem('userName', newName);
            document.getElementById('display-name').innerText = newName;
            
            // Revert UI
            toggleEdit();
            alert("Profile Updated Successfully!");
        }
    </script>
</body>
</html>
