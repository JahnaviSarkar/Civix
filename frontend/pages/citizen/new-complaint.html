<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/forms.css">
    <title>Report Issue | Smart Waste</title>
</head>
<body class="dashboard-body">
    <nav class="side-nav">
        <div class="nav-brand"><h3>SMART WASTE</h3></div>
        <div class="nav-links">
            <button class="nav-item" onclick="location.href='dashboard.html'">Dashboard</button>
            <button class="nav-item active">New Complaint</button>
            <button class="nav-item" onclick="location.href='profile.html'">Profile</button>
        </div>
        <button class="nav-item logout-btn" onclick="logout()">Logout</button>
    </nav>

    <main class="main-content">
        <header class="content-header">
            <h1>Submit Report</h1>
            <p>Ensure all fields are accurate for faster resolution.</p>
        </header>

        <form onsubmit="submitComplaint(event)" class="curved-form">
            <div class="form-card">
                <label class="field-label">Complaint Title</label>
                <input type="text" id="title" class="pill-input" placeholder="Enter a brief title" required>
                
                <div class="dual-row">
                    <div class="field-group">
                        <label class="field-label">Category</label>
                        <select id="category" class="pill-input" required>
                            <option value="overflow">Overflowing Bin</option>
                            <option value="illegal">Illegal Dumping</option>
                            <option value="drain">Clogged Drain</option>
                        </select>
                    </div>
                    <div class="field-group">
                        <label class="field-label">Priority Level</label>
                        <select id="priority" class="pill-input">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="grid-layout">
                <div class="form-card">
                    <label class="field-label">Visual Proof</label>
                    <div class="upload-area" onclick="document.getElementById('waste-photo').click()">
                        <img id="photo-preview" style="display:none; width:100%; height:100%; object-fit:cover; border-radius:20px;">
                        <div id="upload-text">Click to Upload Image</div>
                    </div>
                    <input type="file" id="waste-photo" hidden accept="image/*" onchange="handlePhotoUpload(event)">
                </div>

                <div class="form-card">
                    <label class="field-label">GPS Location</label>
                    <div id="map-box">
                        <div id="map" style="height:100%; width:100%;"></div>
                        <input type="text" id="coords" class="overlay-input" readonly placeholder="Waiting for GPS...">
                    </div>
                </div>
            </div>

            <div class="form-card">
                <label class="field-label">Description</label>
                <textarea id="description" class="curved-textarea" rows="3" placeholder="Provide additional details..."></textarea>
            </div>

            <div class="button-row" style="display:flex; justify-content: flex-end; gap: 15px; margin-top: 20px;">
                <button type="button" class="cancel-btn" onclick="location.href='dashboard.html'" style="padding: 14px 30px; border-radius:30px; border:1px solid #ddd; background:white; cursor:pointer;">Discard</button>
                <button type="submit" class="submit-btn">Submit Report</button>
            </div>
        </form>
    </main>

    <script src="../../js/citizen.js"></script>
    <script async defer src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap"></script>
</body>
</html>
