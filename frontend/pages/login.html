<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/forms.css">
    <title>Login | Smart Waste App</title>
</head>

<script src="../../js/auth.js"></script>

<script src="../js/auth.js"></script>
<body>
    <div class="login-container">
        <h2>System Login</h2>
        <div class="role-selector">
            <button onclick="switchLogin('citizen')">Citizen</button>
            <button onclick="switchLogin('admin')">Admin</button>
            <button onclick="switchLogin('crew')">Crew</button>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div id="email-group" class="input-group">
                <input type="email" id="loginEmail" placeholder="Email Address">
            </div>
            <div id="org-id-group" class="input-group" style="display:none;">
                <input type="text" id="orgId" placeholder="Organization ID">
            </div>
            <div id="crew-id-group" class="input-group" style="display:none;">
                <input type="text" id="crewId" placeholder="Crew ID">
            </div>
            
            <div class="input-group">
                <input type="password" id="loginPass" placeholder="Password" required>
            </div>
            
            <button type="submit" class="btn-primary">Login to Dashboard</button>
        </form>
    </div>
    <script src="../../js/auth.js"></script>
    
</body>
</html>
