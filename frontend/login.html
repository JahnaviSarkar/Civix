<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title> Sign in — Civix</title>
            <link rel="icon"
                href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232563EB'/%3E%3Ctext x='50' y='66' font-family='Inter,sans-serif' font-size='56' font-weight='800' fill='white' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E" />
            <link rel="stylesheet" href="style.css" />
            </head>

            <body>
                <div id="root"></div>

                <main class="auth-shell">
                    <div class="auth-card" data-testid="auth-card">
                        <a class="auth-back" href="index.html" data-testid="auth-back-link">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.4">
                                <path d="M15 6l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round" /></svg>
                                Back to home
                                </a>

                                <div class="auth-head">
                                    <a class="brand" href="index.html">
                                        <span class="brand-mark blue">C</span>
                                            Civix
                                            </a>
                                            <h2 style="margin-top: 18px;">Welcome back</h2>
                                            <p> Choose your role and sign in to continue.</p>
                                </div>

                                <!--Segmented control-->
                                    <div class="segmented" role="tablist" data-testid="role-segmented">
                                        <span class="seg-thumb" id="segThumb" aria-hidden="true"></span>
                                            <button class="active" data-role="citizen" role="tab" aria-selected="true"
                                                data-testid="role-tab-citizen">Citizen</button>
                                                <button data-role="admin" role="tab" aria-selected="false"
                                                    data-testid="role-tab-admin">Admin</button>
                                                    <button data-role="crew" role="tab" aria-selected="false"
                                                        data-testid="role-tab-crew">Crew</button>
                                    </div>

                                    <!--Citizen form-->
                                        <form class="auth-form active" id="form-citizen" data-role="citizen"
                                            autocomplete="off" data-testid="form-citizen">
                                            <div class="field">
                                                <label for="citizen-email">Email address</label>
                                                    <input id="citizen-email" type="email" class="input"
                                                        placeholder="you@city.gov" required
                                                        data-testid="citizen-email-input" />
                                                    </div>
                                                    <div class="field">
                                                        <label for="citizen-pass">Password</label>
                                                            <input id="citizen-pass" type="password" class="input"
                                                                placeholder="••••••••" required
                                                                data-testid="citizen-password-input" />
                                                    </div>
                                                    <button type="submit" class="btn btn-blue btn-lg btn-block"
                                                        data-testid="citizen-submit-button">Sign in as Citizen</button>
                                        </form>

                                        <!--Admin form-->
                                            <form class="auth-form" id="form-admin" data-role="admin" autocomplete="off"
                                                data-testid="form-admin">
                                                <div class="field">
                                                    <label for="admin-org">Organization ID</label>
                                                        <input id="admin-org" type="text" class="input"
                                                            placeholder="ORG-00421" required
                                                            data-testid="admin-org-input" />
                                                        </div>
                                                        <div class="field">
                                                            <label for="admin-pass">Password</label>
                                                                <input id="admin-pass" type="password" class="input"
                                                                    placeholder="••••••••" required
                                                                    data-testid="admin-password-input" />
                                                        </div>
                                                        <button type="submit" class="btn btn-blue btn-lg btn-block"
                                                            data-testid="admin-submit-button">Sign in as Admin</button>
                                            </form>

                                            <!--Crew form-->
                                                <form class="auth-form" id="form-crew" data-role="crew"
                                                    autocomplete="off" data-testid="form-crew">
                                                    <div class="field">
                                                        <label for="crew-id">Crew ID</label>
                                                            <input id="crew-id" type="text" class="input"
                                                                placeholder="CRW-9381" required
                                                                data-testid="crew-id-input" />
                                                            </div>
                                                            <div class="field">
                                                                <label for="crew-pass">Password</label>
                                                                    <input id="crew-pass" type="password" class="input"
                                                                        placeholder="••••••••" required
                                                                        data-testid="crew-password-input" />
                                                            </div>
                                                            <button type="submit" class="btn btn-blue btn-lg btn-block"
                                                                data-testid="crew-submit-button">Sign in as
                                                                Crew</button>
                                                </form>

                                                <!-- Demo Logins -->
                                                <div class="demo-logins" style="margin-top: 1.5rem; text-align: center; border-top: 1px solid var(--slate-200); padding-top: 1rem; margin-bottom: 1rem;">
                                                    <p style="margin-bottom: 0.5rem; color: var(--slate-500); font-size: 0.85rem; font-weight: 500;">Demo Access</p>
                                                    <div style="display: flex; gap: 0.5rem; justify-content: center;">
                                                        <button type="button" class="btn btn-ghost demo-btn" data-role="citizen" style="padding: 6px 12px; font-size: 12.5px;">Citizen</button>
                                                        <button type="button" class="btn btn-ghost demo-btn" data-role="admin" style="padding: 6px 12px; font-size: 12.5px;">Admin</button>
                                                        <button type="button" class="btn btn-ghost demo-btn" data-role="crew" style="padding: 6px 12px; font-size: 12.5px;">Crew</button>
                                                    </div>
                                                </div>

                                                <p class="auth-foot">Need access? <a href="#"
                                                        data-testid="contact-admin-link">Contact your administrator</a>
                                                </p>
                                                </div>
                </main>

                <script>
                    // Ensure the user is fully logged out when hitting the login page
                    localStorage.removeItem('authToken');
                    localStorage.removeItem('uid');
                </script>
                <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
                <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
                <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
                <script src="auth.js"></script>
            </body>

            </html>
